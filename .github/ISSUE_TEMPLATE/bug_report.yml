name: Bug report
description: Report a reproducible score transformation or workflow problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not upload copyrighted scores unless you have permission to share them.
  - type: input
    id: version
    attributes:
      label: Toolkit version
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: Workflow
      options: [transpose, convert, recognize, Python API]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true

